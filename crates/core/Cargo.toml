[package]
name = "mitschnitt-core"
description = "Bit-exact per-app audio capture for Windows and Linux: capture, verification and forensic checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
dirs = "7.0.0"
flac-codec = "1.3.3"
getrandom = "0.3"
hound = "3.5.1"
id3 = "1.17.2"
mp3lame-encoder = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
ureq = { version = "3.4.2", features = ["json"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_System_Variant", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Media", "Media_Control", "Foundation", "Foundation_Collections", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Storage_Streams", "Win32_System_Power", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop"] }
windows-core = "0.62.2"
zip = "9.0.0"

[target."cfg(target_os = \"linux\")".dependencies]
pipewire = "0.10.1"
zbus = "5.19.0"
